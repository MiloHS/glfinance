[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glfinance"
version = "0.1.0"
description = "Reproducible graph-learning experiments for financial portfolios"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cvxpy>=1.4,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pandas-datareader>=0.10",
  "fredapi>=0.5",
  "pyomo>=6.7",
  "idaes-pse>=2.4",
  "PyYAML>=6,<7",
  "scikit-learn>=1.3,<2",
  "scipy>=1.11,<2",
  "yfinance>=0.2.40,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
notebook = [
  "ipykernel>=6,<7",
  "jupyter>=1,<2",
]

[project.scripts]
glfinance-portfolio = "glfinance.experiments.portfolio:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

